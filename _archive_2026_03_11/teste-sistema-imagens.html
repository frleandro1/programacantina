<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Banco de Imagens</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; border-bottom: 3px solid #007bff; padding-bottom: 10px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .status.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .test-section { margin: 20px 0; padding: 15px; background: #f9f9f9; border-left: 4px solid #007bff; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Teste do Sistema de Imagens</h1>
        
        <div class="test-section">
            <h2>1. Teste API - Listar Imagens</h2>
            <button onclick="testarListar()">Testar API List</button>
            <div id="resultado-listar"></div>
        </div>

        <div class="test-section">
            <h2>2. Teste - Carregamento de Produtos</h2>
            <button onclick="testarProdutos()">Testar Produtos</button>
            <div id="resultado-produtos"></div>
        </div>

        <div class="test-section">
            <h2>3. Teste - Upload (Simular)</h2>
            <button onclick="testarUpload()">Simular Upload</button>
            <div id="resultado-upload"></div>
        </div>

        <div class="test-section">
            <h2>4. Status Geral</h2>
            <button onclick="testarTudo()">Executar Todos os Testes</button>
            <div id="resultado-geral"></div>
        </div>
    </div>

    <script>
        async function testarListar() {
            const div = document.getElementById('resultado-listar');
            div.innerHTML = '<p>Carregando...</p>';
            
            try {
                const response = await fetch('/Cantina/api/imagens.php?action=list');
                const data = await response.json();
                
                let html = `<div class="status ok">✅ Sucesso (HTTP ${response.status})</div>`;
                html += `<p><strong>Total de imagens:</strong> ${data.total}</p>`;
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                
                div.innerHTML = html;
            } catch (e) {
                div.innerHTML = `<div class="status error">❌ Erro: ${e.message}</div>`;
            }
        }

        async function testarProdutos() {
            const div = document.getElementById('resultado-produtos');
            div.innerHTML = '<p>Carregando...</p>';
            
            try {
                const response = await fetch('/Cantina/api/produtos.php?action=listar');
                const data = await response.json();
                
                let html = `<div class="status ok">✅ Sucesso (HTTP ${response.status})</div>`;
                html += `<p><strong>Total de produtos:</strong> ${data.dados ? data.dados.length : 0}</p>`;
                
                if (data.dados && data.dados.length > 0) {
                    html += '<p><strong>Produtos:</strong></p><ul>';
                    data.dados.forEach(p => {
                        html += `<li>#${p.id} - ${p.nome} (Imagem: ${p.imagem || 'NULL'})</li>`;
                    });
                    html += '</ul>';
                }
                
                html += `<pre>${JSON.stringify(data.dados ? data.dados.slice(0, 2) : [], null, 2)}</pre>`;
                
                div.innerHTML = html;
            } catch (e) {
                div.innerHTML = `<div class="status error">❌ Erro: ${e.message}</div>`;
            }
        }

        async function testarUpload() {
            const div = document.getElementById('resultado-upload');
            div.innerHTML = `
                <p>Para testar upload real:</p>
                <ol>
                    <li>Acesse <a href="/Cantina/admin-imagens.html" target="_blank">admin-imagens.html</a></li>
                    <li>Selecione um produto no dropdown</li>
                    <li>Clique ou arraste uma imagem (JPG, PNG, GIF, WebP)</li>
                    <li>Clique em "Upload da Imagem"</li>
                </ol>
                <p><strong>Ou via admin.html:</strong></p>
                <ol>
                    <li>Acesse <a href="/Cantina/admin.html" target="_blank">admin.html</a></li>
                    <li>Vá para a aba "Imagens" ou clique no botão 🖼️ de um produto</li>
                    <li>Selecione uma imagem e faça upload</li>
                </ol>
            `;
        }

        async function testarTudo() {
            const div = document.getElementById('resultado-geral');
            div.innerHTML = '<p>Executando testes...</p>';
            
            try {
                // Teste 1: Conexão
                const conn = await fetch('/Cantina/db/config.php');
                
                // Teste 2: API Imagens
                const apiIm = await fetch('/Cantina/api/imagens.php?action=list');
                const dataIm = await apiIm.json();
                
                // Teste 3: API Produtos
                const apiProd = await fetch('/Cantina/api/produtos.php?action=listar');
                const dataProd = await apiProd.json();
                
                // Teste 4: Verificar diretório
                const dirCheck = await fetch('/Cantina/uploads/produtos/');
                
                let html = '<div class="status ok">✅ Sistema de Imagens está FUNCIONANDO!</div>';
                html += `<ul>
                    <li>✅ API de Imagens: OK (${dataIm.total} imagens)</li>
                    <li>✅ API de Produtos: OK (${dataProd.dados.length} produtos)</li>
                    <li>✅ Diretório de uploads: ${dirCheck.ok ? 'OK' : 'Aviso'}</li>
                </ul>`;
                html += `
                    <h3>Próximos Passos:</h3>
                    <ol>
                        <li>Faça login em <a href="/Cantina/" target="_blank">http://localhost/Cantina/</a></li>
                        <li>Selecione "Administrador" no menu</li>
                        <li>Vá para "Imagens" ou use os botões 🖼️ na aba Produtos</li>
                        <li>Faça upload de imagens para seus produtos</li>
                    </ol>
                `;
                
                div.innerHTML = html;
            } catch (e) {
                div.innerHTML = `<div class="status error">❌ Erro nos testes: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
