<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Programa Cantina</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff7a45 0%, #ff6a3d 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-card h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #ff7a45;
            box-shadow: 0 0 0 3px rgba(255, 122, 69, 0.1);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff7a45 0%, #ff6a3d 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 122, 69, 0.3);
        }
        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            padding: 12px;
            background: #f8d7da;
            border-radius: 6px;
            display: none;
        }
        .success {
            color: #155724;
            font-size: 14px;
            margin-top: 10px;
            padding: 12px;
            background: #d4edda;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🍽️ Programa Cantina</h1>

        <form method="POST" action="processar-login.php">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" placeholder="Digite seu usuário" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>

        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>

        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; font-size: 12px; color: #999;">
            <p>Credenciais de teste:</p>
            <p><strong>admin</strong> / <strong>admin123</strong></p>
        </div>
    </div>

    <script>
        // Verificar conexão da API
        async function verificarConexao() {
            try {
                const res = await fetch('api/diagnostico.php?t=' + Date.now());
                if (!res.ok) {
                    console.warn('⚠️ Resposta da API: ' + res.status);
                }
            } catch (err) {
                console.error('❌ Erro de conexão:', err);
            }
        }

        // Interceptar submit do formulário
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            try {
                const res = await fetch('api/auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.sucesso) {
                    successMsg.textContent = '✅ Login realizado! Redirecionando...';
                    successMsg.style.display = 'block';

                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    localStorage.setItem('username', username);

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    errorMsg.textContent = '❌ ' + (data.mensagem || 'Erro ao fazer login');
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = '❌ Erro de conexão: ' + err.message;
                errorMsg.style.display = 'block';
                console.error('Erro:', err);
            }
        });

        // Verificar conexão ao carregar
        window.addEventListener('load', verificarConexao);
    </script>
</body>
</html>
