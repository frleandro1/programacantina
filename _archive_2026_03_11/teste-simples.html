<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Teste Simples</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .box { background: white; padding: 20px; border-radius: 8px; margin: 10px 0; }
        button { padding: 10px 20px; background: #ff7a45; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #resultado { margin-top: 20px; padding: 15px; background: #e8f4f8; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🧪 Teste Simples de Conexão</h1>
    
    <div class="box">
        <h3>1. Status do Servidor</h3>
        <p>Se você vê esta página, o servidor está <strong style="color: green;">✅ OK</strong></p>
    </div>
    
    <div class="box">
        <h3>2. Teste de Fetch</h3>
        <button onclick="testarFetch()">Clique para testar conexão com API</button>
        <div id="resultado"></div>
    </div>
    
    <script>
        async function testarFetch() {
            const resultado = document.getElementById('resultado');
            resultado.textContent = '⏳ Testando...';
            
            try {
                console.log('Fazendo fetch para: api/diagnostico.php');
                const response = await fetch('api/diagnostico.php?t=' + Date.now());
                console.log('Status da resposta:', response.status);
                
                if (!response.ok) {
                    resultado.innerHTML = '<p style="color: red;">❌ Erro HTTP: ' + response.status + '</p>';
                    return;
                }
                
                const data = await response.json();
                console.log('Dado recebido:', data);
                
                if (data.login && data.login.status === 'funcionando') {
                    resultado.innerHTML = '<p style="color: green;">✅ API RESPONDENDO CORRETAMENTE!</p>' +
                        '<p>Usuário: <strong>' + data.login.usuario.login + '</strong></p>' +
                        '<p>Banco de dados: ' + Object.keys(data.database.tables).length + ' tabelas</p>';
                } else {
                    resultado.innerHTML = '<p style="color: orange;">⚠️ API respondendo mas com erro</p>';
                }
            } catch (err) {
                console.error('Erro:', err);
                resultado.innerHTML = '<p style="color: red;">❌ Erro: ' + err.message + '</p>';
            }
        }
        
        // Testar automaticamente ao carregar
        window.addEventListener('load', function() {
            console.log('Página carregada. Testando API...');
            testarFetch();
        });
    </script>
</body>
</html>
