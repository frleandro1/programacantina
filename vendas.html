<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendas - Programa Cantina</title>
<link rel="stylesheet" href="css/theme.css">
<style>
body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  margin: 0;
  background: #f5f5f5;
}

.content-wrapper {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.main {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.sidebar {
  width: 380px;
  background: white;
  border-left: 1px solid #e0e0e0;
  padding: 15px;
  display: flex;
  flex-direction: column;
  box-shadow: -2px 0 10px rgba(0,0,0,0.05);
}

.sidebar h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 20px 0;
  color: #333;
}

.sidebar h2::before {
  content: '';
  font-size: 24px;
}

.badge {
  background: var(--brand);
  color: white;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: normal;
}

.cart-list {
  flex: 1;
  overflow-y: auto;
  margin-bottom: 20px;
}

.cart-empty {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}

.cart-empty-icon {
  font-size: 80px;
  margin-bottom: 15px;
  opacity: 0.3;
}

.cart-item {
  background: #f8f9fa;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  border: 1px solid #e9ecef;
}

.cart-item-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.cart-item-info strong {
  color: #333;
  font-size: 15px;
}

.cart-item-info span {
  color: var(--brand);
  font-weight: 600;
}

.cart-item-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.btn-qtd {
  width: 35px;
  height: 35px;
  border: 2px solid #dee2e6;
  background: white;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
  color: #495057;
  transition: all 0.2s;
}

.btn-qtd:hover {
  background: #f8f9fa;
  border-color: var(--brand);
  color: var(--brand);
}

.cart-item-controls span {
  min-width: 30px;
  text-align: center;
  font-weight: 600;
  font-size: 16px;
  color: #333;
}

.btn-remove {
  width: 35px;
  height: 35px;
  background: #dc3545;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 20px;
  font-weight: bold;
  transition: all 0.2s;
  margin-left: auto;
}

.btn-remove::before {
  content: '';
}

.btn-remove:hover {
  background: #c82333;
  transform: scale(1.05);
}

.cart-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 22px;
  font-weight: bold;
  padding: 20px 0;
  border-top: 2px solid #dee2e6;
  margin-bottom: 15px;
  color: #333;
}

.cart-total span:last-child {
  color: var(--brand);
  font-size: 26px;
}

#btnFinalizar:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.tabs {
  display: flex;
  gap: 12px;
  margin-bottom: 25px;
}

.tab-btn {
  padding: 14px 28px;
  background: white;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 15px;
  color: #666;
  transition: all 0.3s;
}

.tab-btn.active {
  background: var(--brand);
  color: white;
  border-color: var(--brand);
  box-shadow: 0 4px 12px rgba(255, 122, 69, 0.3);
}

.tab-btn:hover:not(.active) {
  border-color: var(--brand);
  color: var(--brand);
}

.prod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.prod-card {
  background: white;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  text-align: center;
  transition: all 0.3s;
  border: 2px solid transparent;
}

.prod-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  border-color: var(--brand-2);
}

.prod-card h3 {
  margin: 0 0 12px 0;
  color: #333;
  font-size: 18px;
}

.prod-preco {
  font-size: 24px;
  font-weight: bold;
  color: var(--brand);
  margin: 12px 0;
}

.prod-estoque {
  color: #6c757d;
  font-size: 13px;
  margin-bottom: 18px;
}

.prod-card .btn-primary {
  width: 100%;
  padding: 12px;
  font-size: 14px;
  font-weight: 600;
}

.prod-card .btn-primary:disabled {
  background: #ccc;
  cursor: not-allowed;
}

.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}

.modal.show {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  background: white;
  padding: 0;
  border-radius: 16px;
  width: 90%;
  max-width: 450px;
  max-height: 85vh;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  animation: slideUp 0.3s ease;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

@keyframes slideUp {
  from {
    transform: translateY(50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.modal-header {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: white;
  padding: 24px 30px;
  text-align: center;
  border-radius: 16px 16px 0 0;
}

.modal-header h2 {
  margin: 0;
  font-size: 24px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.modal-header h2::before {
  content: '';
  font-size: 28px;
}

.modal-body {
  padding: 30px;
  overflow-y: auto;
  flex: 1;
}

#cupomPreview {
  background: #f8f9fa;
  padding: 25px;
  border-radius: 10px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.6;
  color: #333;
  border: 2px dashed #dee2e6;
  white-space: pre-wrap;
  word-break: break-word;
}

.modal-footer {
  padding: 20px 30px;
  background: #f8f9fa;
  display: flex;
  gap: 12px;
  border-top: 1px solid #e0e0e0;
}

.modal-footer button {
  flex: 1;
  padding: 14px;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-print {
  background: linear-gradient(135deg, #28a745, #20c997);
  color: white;
}

.btn-print:hover {
  background: linear-gradient(135deg, #218838, #1ba87e);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
}

.btn-print::before {
  content: '';
  font-size: 18px;
}

.btn-novo {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: white;
}

.btn-novo:hover {
  background: linear-gradient(135deg, var(--brand-dark), var(--brand));
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(255, 122, 69, 0.4);
}

.btn-novo::before {
  content: '';
  font-size: 18px;
}

.btn-cancelar {
  background: #6c757d;
  color: white;
}

.btn-cancelar:hover {
  background: #5a6268;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(108, 117, 125, 0.4);
}

.btn-cancelar::before {
  content: '';
  font-size: 20px;
}

@media print {
  body * {
    visibility: hidden;
  }
  #cupomModal,
  #cupomModal * {
    visibility: visible;
  }
  #cupomModal {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: flex !important;
    align-items: center;
    justify-content: center;
    background: white;
  }
  .modal-content {
    box-shadow: none !important;
    max-width: 80mm;
    margin: 0 auto;
    background: white;
  }
  .modal-header,
  .modal-footer {
    display: none !important;
  }
  .modal-body {
    padding: 10mm !important;
  }
  #cupomPreview {
    background: white !important;
    border: none !important;
    padding: 0 !important;
  }
}

/* Logo e Banner */
.logo-container {
  text-align: center;
  padding: 4px 0;
  background: linear-gradient(135deg, rgba(255, 122, 69, 0.05) 0%, rgba(52, 149, 235, 0.05) 50%);
}

.logo-container:empty,
.banner-container:empty {
  display: none;
}

.logo-img {
  display: block;
  margin: 0 auto;
  max-height: 48px;
  width: auto;
  max-width: 220px;
  object-fit: contain;
}

.banner-container {
  width: 100%;
  text-align: center;
  background: #f0f0f0;
  max-height: 110px;
  overflow: hidden;
}

.banner-img {
  display: block;
  margin: 0 auto;
  width: 100%;
  max-width: 1200px;
  max-height: 110px;
  height: auto;
  object-fit: cover;
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Programa Cantina</div>
  <nav class="nav">
    <a href="vendas.html" class="active">Vendas</a>
    <a href="dashboard.html">Produção</a>
    <a href="login-menu.html" onclick="logout()">Sair</a>
  </nav>
</div>
<div id="logoContainer" class="logo-container"></div>
<div id="bannerContainer" class="banner-container"></div>
<div class="content-wrapper">
  <div class="main">
    <div class="tabs">
      <button class="tab-btn active" data-grupo="Salgado">Salgado</button>
      <button class="tab-btn" data-grupo="Bebida">Bebida</button>
      <button class="tab-btn" data-grupo="Doce">Doce</button>
    </div>
    <div id="prodGrid" class="prod-grid"></div>
  </div>
  <div class="sidebar">
    <h2>Carrinho <span class="badge" id="cartBadge">0 itens</span></h2>
    <div id="cartList" class="cart-list">
      <div class="cart-empty">
        <div class="cart-empty-icon"></div>
        <p>Carrinho vazio</p>
      </div>
    </div>
    <div class="cart-total">
      <span>Total:</span>
      <span id="totalText">R$ 0,00</span>
    </div>
    <button id="btnFinalizar" class="btn btn-primary" disabled> Finalizar Venda</button>
  </div>
</div>
<div id="cupomModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Cupom Fiscal</h2>
    </div>
    <div class="modal-body">
      <div id="cupomPreview"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-print" onclick="window.print()">Imprimir</button>
      <button class="btn-novo" onclick="novoPedido()">Novo Pedido</button>
      <button class="btn-cancelar" onclick="fecharModal()">Fechar</button>
    </div>
  </div>
</div>
<script src="js/vendas.js"></script>
<script>
// Controlar visibilidade de links baseado no tipo de usuário
document.addEventListener('DOMContentLoaded', () => {
  const userType = localStorage.getItem('userType') || 'vendedor';
  
  // Se for vendedor, esconder link de Administração
  if (userType === 'vendedor' || userType === 'usuario') {
    const adminLink = document.querySelector('a[href="admin.html"]');
    if (adminLink) {
      adminLink.style.display = 'none';
    }
    
    // Também esconder link de Produção/Dashboard se for vendedor
    const dashboardLink = document.querySelector('a[href="dashboard.html"]');
    if (dashboardLink) {
      dashboardLink.style.display = 'none';
    }
  }
});
</script>
<script src="js/vendas-config.js"></script>
</body>
</html>
