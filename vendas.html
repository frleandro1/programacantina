<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendas - Cantina IBFC</title>
<link rel="stylesheet" href="css/theme.css">
<style>
body {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  height: auto;
  margin: 0;
  background: #f5f5f5;
}

/* Neutraliza regra global .topbar + * do theme.css nesta tela */
.topbar + * {
  display: block;
  flex: 0 0 auto;
  overflow: visible;
}

.content-wrapper {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: visible;
}

.main {
  flex: 1;
  padding: 10px;
  overflow: visible;
}

.sidebar {
  width: 380px;
  background: white;
  border-left: 1px solid #e0e0e0;
  padding: 15px;
  display: flex;
  flex-direction: column;
  box-shadow: -2px 0 10px rgba(0,0,0,0.05);
}

.sidebar h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 20px 0;
  color: #333;
}

.sidebar h2::before {
  content: '';
  font-size: 24px;
}

.badge {
  background: var(--brand);
  color: white;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: normal;
}

.cart-list {
  flex: 1;
  overflow-y: auto;
  margin-bottom: 20px;
}

.cart-empty {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}

.cart-empty-icon {
  font-size: 80px;
  margin-bottom: 15px;
  opacity: 0.3;
}

.cart-item {
  background: #f8f9fa;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  border: 1px solid #e9ecef;
}

.cart-item-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.cart-item-info strong {
  color: #333;
  font-size: 15px;
}

.cart-item-info span {
  color: var(--brand);
  font-weight: 600;
}

.cart-item-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.btn-qtd {
  width: 35px;
  height: 35px;
  border: 2px solid #dee2e6;
  background: white;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
  color: #495057;
  transition: all 0.2s;
}

.btn-qtd:hover {
  background: #f8f9fa;
  border-color: var(--brand);
  color: var(--brand);
}

.cart-item-controls span {
  min-width: 30px;
  text-align: center;
  font-weight: 600;
  font-size: 16px;
  color: #333;
}

.btn-remove {
  width: 35px;
  height: 35px;
  background: #dc3545;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 20px;
  font-weight: bold;
  transition: all 0.2s;
  margin-left: auto;
}

.btn-remove::before {
  content: '';
}

.btn-remove:hover {
  background: #c82333;
  transform: scale(1.05);
}

.cart-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 22px;
  font-weight: bold;
  padding: 20px 0;
  border-top: 2px solid #dee2e6;
  margin-bottom: 15px;
  color: #333;
}

.cart-total span:last-child {
  color: var(--brand);
  font-size: 26px;
}

#btnFinalizar:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.tabs {
  display: flex;
  gap: 12px;
  margin-bottom: 25px;
}

.quick-products-section {
  margin-bottom: 24px;
  padding: 18px;
  background: white;
  border: 1px solid #e6e6e6;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}

.quick-products-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.quick-products-header h2 {
  margin: 0;
  color: #333;
  font-size: 20px;
}

.quick-products-header span {
  color: #666;
  font-size: 13px;
}

.prod-grid-quick {
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
}

.tab-btn {
  padding: 14px 28px;
  background: white;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 15px;
  color: #666;
  transition: all 0.3s;
}

.tab-btn.active {
  background: var(--brand);
  color: white;
  border-color: var(--brand);
  box-shadow: 0 4px 12px rgba(255, 122, 69, 0.3);
}

.tab-btn:hover:not(.active) {
  border-color: var(--brand);
  color: var(--brand);
}

.prod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.prod-card {
  background: white;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  text-align: center;
  transition: all 0.3s;
  border: 2px solid transparent;
}

.prod-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  border-color: var(--brand-2);
}

.prod-card h3 {
  margin: 0 0 12px 0;
  color: #333;
  font-size: 18px;
}

.prod-descricao {
  min-height: 36px;
  margin: 0 0 10px 0;
  color: #6c757d;
  font-size: 13px;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.prod-imagem-wrap {
  width: 100%;
  height: 130px;
  margin-bottom: 14px;
  border-radius: 12px;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(255, 122, 69, 0.12), rgba(52, 152, 219, 0.12));
  display: flex;
  align-items: center;
  justify-content: center;
}

.prod-imagem {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.prod-imagem-fallback {
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  font-size: 46px;
}

.prod-preco {
  font-size: 24px;
  font-weight: bold;
  color: var(--brand);
  margin: 12px 0;
}

.prod-estoque {
  color: #6c757d;
  font-size: 13px;
  margin-bottom: 18px;
}

.prod-card .btn-primary {
  width: 100%;
  padding: 12px;
  font-size: 14px;
  font-weight: 600;
}

.prod-card .btn-primary:disabled {
  background: #ccc;
  cursor: not-allowed;
}

.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}

.modal.show {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  background: white;
  padding: 0;
  border-radius: 16px;
  width: 90%;
  max-width: 450px;
  max-height: 85vh;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  animation: slideUp 0.3s ease;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

@keyframes slideUp {
  from {
    transform: translateY(50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.modal-header {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: white;
  padding: 24px 30px;
  text-align: center;
  border-radius: 16px 16px 0 0;
}

.modal-header h2 {
  margin: 0;
  font-size: 24px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.modal-header h2::before {
  content: '';
  font-size: 28px;
}

.modal-body {
  padding: 30px;
  overflow-y: auto;
  flex: 1;
}

#cupomPreview {
  background: #f8f9fa;
  padding: 25px;
  border-radius: 10px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.6;
  color: #333;
  border: 2px dashed #dee2e6;
  white-space: pre;
  word-break: normal;
  overflow-wrap: normal;
  display: inline-block;
  max-width: 100%;
  overflow-x: auto;
}

.modal-footer {
  padding: 20px 30px;
  background: #f8f9fa;
  display: flex;
  gap: 12px;
  border-top: 1px solid #e0e0e0;
}

.modal-footer button {
  flex: 1;
  padding: 14px;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-print {
  background: linear-gradient(135deg, #28a745, #20c997);
  color: white;
}

.btn-print:hover {
  background: linear-gradient(135deg, #218838, #1ba87e);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
}

.btn-print::before {
  content: '';
  font-size: 18px;
}

.btn-novo {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: white;
}

.btn-novo:hover {
  background: linear-gradient(135deg, var(--brand-dark), var(--brand));
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(255, 122, 69, 0.4);
}

.btn-novo::before {
  content: '';
  font-size: 18px;
}

.btn-cancelar {
  background: #6c757d;
  color: white;
}

.btn-cancelar:hover {
  background: #5a6268;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(108, 117, 125, 0.4);
}

.btn-cancelar::before {
  content: '';
  font-size: 20px;
}

.btn-teste {
  margin-top: 10px;
  background: linear-gradient(135deg, #0d6efd, #0dcaf0);
  color: #fff;
}

.btn-teste:hover {
  background: linear-gradient(135deg, #0b5ed7, #0aa2c0);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(13, 110, 253, 0.35);
}

@media (max-width: 1024px) {
  body {
    min-height: auto;
  }

  .content-wrapper {
    flex-direction: column;
    overflow: visible;
    min-height: auto;
  }

  .sidebar {
    width: 100%;
    border-left: none;
    border-top: 1px solid #e0e0e0;
    box-shadow: none;
    max-height: none;
    min-height: 0;
  }

  .main {
    padding: 12px;
    overflow: visible;
  }

  .banner-container {
    max-height: 86px;
  }

  .banner-img {
    max-height: 86px;
  }

  .prod-grid,
  .prod-grid-quick {
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
  }
}

@media (max-width: 768px) {
  .topbar {
    height: auto;
    min-height: 70px;
    padding: 10px 12px;
    gap: 8px;
  }

  .brand {
    min-height: 0;
    gap: 8px;
  }

  .brand span {
    font-size: 15px !important;
  }

  .hamburger {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 38px;
    height: 38px;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    padding: 7px 8px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .hamburger span {
    display: block;
    width: 100%;
    height: 2px;
    background: white;
    border-radius: 2px;
    transition: all 0.3s;
    transform-origin: center;
  }

  .hamburger.open span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .hamburger.open span:nth-child(2) {
    opacity: 0;
  }

  .hamburger.open span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .nav {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
    flex-direction: column;
    align-items: flex-end;
  }

  .nav.open {
    display: flex;
  }

  .nav-menu {
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    width: 220px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 70px 16px 24px;
    gap: 8px;
    box-shadow: -4px 0 20px rgba(0,0,0,0.2);
  }

  .nav a {
    white-space: nowrap;
    font-size: 15px;
    padding: 12px 16px;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    display: block;
    text-align: left;
  }

  .nav a:hover, .nav a.active {
    background: rgba(255,255,255,0.28);
  }

  .content-wrapper {
    display: block;
  }

  .main {
    padding: 10px;
  }

  .tabs {
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .tab-btn {
    flex: 0 0 auto;
    padding: 10px 14px;
    font-size: 13px;
  }

  .quick-products-section {
    padding: 12px;
  }

  .quick-products-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .prod-grid,
  .prod-grid-quick {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .prod-card {
    padding: 14px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .prod-card h3 {
    min-height: 44px;
    font-size: 15px;
  }

  .prod-imagem-wrap {
    height: 75px;
  }

  .prod-imagem {
    object-fit: contain;
    padding: 4px;
  }

  .prod-imagem-fallback {
    font-size: 30px;
  }

  .prod-preco {
    font-size: 18px;
  }

  .sidebar {
    max-height: none;
    padding: 12px;
    overflow: visible;
  }

  .cart-list {
    max-height: none;
    overflow: visible;
  }

  .cart-item-controls {
    justify-content: flex-start;
  }

  #btnFinalizar {
    width: 100%;
    position: sticky;
    bottom: 0;
    z-index: 3;
  }

  .cart-total {
    font-size: 18px;
  }

  .cart-total span:last-child {
    font-size: 20px;
  }

  .modal-content {
    width: 96%;
    max-height: 92vh;
  }

  .modal-header {
    padding: 16px;
  }

  .modal-body {
    padding: 14px;
  }

  .modal-footer {
    padding: 12px;
    flex-direction: column;
  }
}

@media (max-width: 430px) {
  html,
  body {
    overflow-x: hidden;
  }

  .prod-imagem-wrap {
    height: 60px;
  }

  .prod-imagem-fallback {
    font-size: 24px;
  }

  .content-wrapper,
  .main,
  .sidebar,
  .tabs,
  .quick-products-section {
    width: 100%;
    max-width: 100%;
  }

  .topbar {
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
  }

  .brand {
    width: auto;
  }
}

@media (max-width: 390px) {
  .main,
  .sidebar {
    padding: 10px;
  }

  .prod-imagem-wrap {
    height: 80px;
  }

  .prod-imagem {
    object-fit: contain;
    padding: 4px;
  }

  .prod-grid,
  .prod-grid-quick {
    grid-template-columns: 1fr;
  }

  .cart-item-info {
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }

  .cart-item-controls {
    gap: 8px;
  }
}

@media print {
  @page {
    margin: 0.5mm;
  }

  html,
  body {
    width: auto !important;
    height: auto !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
    background: #fff !important;
  }

  body * {
    visibility: hidden;
  }

  #cupomModal,
  #cupomModal * {
    visibility: visible;
  }

  #cupomModal {
    position: static !important;
    left: auto !important;
    top: auto !important;
    width: auto !important;
    height: auto !important;
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
  }

  .modal,
  .modal-content,
  .modal-body,
  #cupomPreview {
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    overflow: visible !important;
  }

  .modal-content {
    box-shadow: none !important;
    border: none !important;
    max-width: 80mm; /* sobrescrito dinamicamente pelo js/vendas.js */
    width: fit-content !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #fff !important;
  }

  .modal-header,
  .modal-footer {
    display: none !important;
  }

  .modal-body {
    padding: 0.5mm !important;
    margin: 0 !important;
  }

  #cupomPreview {
    background: white !important;
    border: none !important;
    padding: 0 !important;
    font-family: 'Courier New', Courier, monospace !important;
    font-size: 9pt; /* sobrescrito dinamicamente pelo js/vendas.js */
    line-height: 0.98 !important;
    white-space: pre !important;
    display: inline-block !important;
  }
}

/* Logo e Banner */
.logo-container {
  text-align: center;
  padding: 4px 0;
  background: linear-gradient(135deg, rgba(255, 122, 69, 0.05) 0%, rgba(52, 149, 235, 0.05) 50%);
}

.logo-container:empty,
.banner-container:empty {
  display: none;
}

.logo-img {
  display: block;
  margin: 0 auto;
  max-height: 48px;
  width: auto;
  max-width: 220px;
  object-fit: contain;
}

.brand-logo {
  display: block;
  width: 28px;
  height: 28px;
  object-fit: contain;
  border-radius: 6px;
}

.banner-container {
  width: 100%;
  text-align: center;
  background: #f0f0f0;
  max-height: 110px;
  overflow: hidden;
}

.banner-img {
  display: block;
  margin: 0 auto;
  width: 100%;
  max-width: 1200px;
  max-height: 110px;
  height: auto;
  object-fit: cover;
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <!-- Logo com fallback visual -->
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; background: rgba(255,255,255,0.1); border-radius: 8px; margin-right: 5px;">
      <img 
        src="LOGO_F.png" 
        alt="Logo Cantina" 
        class="brand-logo"
        style="display: block;"
        onerror="this.style.display='none'; this.parentElement.textContent='🍽️';"
      >
    </div>
    <span style="font-size: 18px; font-weight: bold;">LefroCantina</span>
  </div>
  <button class="hamburger" id="hamburguerBtn" aria-label="Menu" style="display:none;" onclick="toggleNav()">
    <span></span><span></span><span></span>
  </button>
  <nav class="nav" id="navMenu" onclick="fecharNavFora(event)">
    <div class="nav-menu">
      <a href="vendas.html" class="active">Vendas</a>
      <a href="dashboard.html">Produção</a>
      <a href="login-menu.html" onclick="if (window.history.length > 1) { window.history.back(); return false; }">Voltar</a>
      <a href="login-menu.html" onclick="logout()">Sair</a>
    </div>
  </nav>
</div>
<div id="logoContainer" class="logo-container"></div>
<div id="bannerContainer" class="banner-container"></div>
<div class="content-wrapper">
  <div class="main">
    <div id="produtosFixosSection" class="quick-products-section" style="display:none;">
      <div class="quick-products-header">
        <h2>Produtos rápidos</h2>
        <span>atalhos escolhidos no painel administrativo</span>
      </div>
      <div id="prodGridFixos" class="prod-grid prod-grid-quick"></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-grupo="Todos">Todos</button>
      <button class="tab-btn" data-grupo="Salgado">Salgado</button>
      <button class="tab-btn" data-grupo="Bebida">Bebida</button>
      <button class="tab-btn" data-grupo="Doce">Doce</button>
    </div>
    <div id="prodGrid" class="prod-grid"></div>
  </div>
  <div class="sidebar">
    <h2>Carrinho <span class="badge" id="cartBadge">0 itens</span></h2>
    <div id="cartList" class="cart-list">
      <div class="cart-empty">
        <div class="cart-empty-icon"></div>
        <p>Carrinho vazio</p>
      </div>
    </div>
    <div class="cart-total">
      <span>Total:</span>
      <span id="totalText">R$ 0,00</span>
    </div>
    <button id="btnFinalizar" class="btn btn-primary" disabled> Finalizar Venda</button>

  </div>
</div>
<div id="cupomModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Cupom Fiscal</h2>
    </div>
    <div class="modal-body">
      <div id="cupomPreview"></div>
    </div>
    <div id="printStatusMsg" style="display:none;font-size:13px;padding:6px 12px;border-radius:6px;background:rgba(0,0,0,0.05);margin:0 12px 4px;"></div>

<script>
(function() {
  const btn = document.getElementById('hamburguerBtn');
  const nav = document.getElementById('navMenu');
  const mq = window.matchMedia('(max-width: 768px)');

  function aplicar(mobile) {
    btn.style.display = mobile ? 'flex' : 'none';
    if (!mobile) nav.classList.remove('open');
  }

  mq.addEventListener('change', e => aplicar(e.matches));
  aplicar(mq.matches);

  window.toggleNav = function() {
    btn.classList.toggle('open');
    nav.classList.toggle('open');
    document.body.style.overflow = nav.classList.contains('open') ? 'hidden' : '';
  };

  window.fecharNavFora = function(e) {
    if (e.target === nav) {
      btn.classList.remove('open');
      nav.classList.remove('open');
      document.body.style.overflow = '';
    }
  };
})();
</script>
<script>
// Controlar visibilidade de links baseado no tipo de usuário
document.addEventListener('DOMContentLoaded', () => {
  const userType = localStorage.getItem('userType') || 'vendedor';
  
  // Se for vendedor, esconder link de Administração
  if (userType === 'vendedor' || userType === 'usuario') {
    const adminLink = document.querySelector('a[href="admin.html"]');
    if (adminLink) {
      adminLink.style.display = 'none';
    }
    
    // Também esconder link de Produção/Dashboard se for vendedor
    const dashboardLink = document.querySelector('a[href="dashboard.html"]');
    if (dashboardLink) {
      dashboardLink.style.display = 'none';
    }
  }
});
</script>
<script src="js/vendas-config.js?v=20260401"></script>
