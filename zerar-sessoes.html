<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zerar Sessões - Lefro Cantina</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      color: #666;
      text-align: center;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .info-box {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 14px;
      color: #333;
    }

    .status-sessoes {
      text-align: center;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .status-sessoes .numero {
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
      margin: 5px 0;
    }

    .botoes {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .btn {
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-warning {
      background: #f39c12;
      color: white;
    }

    .btn-warning:hover {
      background: #e67e22;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
    }

    .btn-danger:hover {
      background: #c0392b;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
    }

    .btn-secondary {
      background: #95a5a6;
      color: white;
    }

    .btn-secondary:hover {
      background: #7f8c8d;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .mensagem {
      padding: 14px;
      border-radius: 8px;
      margin-top: 20px;
      display: none;
      font-size: 14px;
      text-align: center;
    }

    .mensagem.sucesso {
      background: #d5f4e6;
      color: #16a085;
      display: block;
    }

    .mensagem.erro {
      background: #fadbd8;
      color: #c0392b;
      display: block;
    }

    .carregando {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .warning-icon {
      font-size: 20px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 22px;
      }

      .btn {
        font-size: 14px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🔄 Zerar Sessões de Caixa</h1>
  <p class="subtitle">Limpar dados de sessão do sistema</p>

  <div class="info-box">
    ⚠️ <strong>Atenção:</strong> Esta ação é irreversível. Todas as sessões e vendas associadas serão deletadas permanentemente. Os IDs serão resetados para começar do 1.
  </div>

  <div class="status-sessoes">
    <div>Sessões ativas no sistema:</div>
    <div class="numero" id="totalSessoes">-</div>
  </div>

  <div class="botoes">
    <button class="btn btn-warning" onclick="zerarAbertas()">
      <span class="warning-icon">⚠️</span>
      <span>Zerar Apenas Sessões Abertas</span>
    </button>

    <button class="btn btn-danger" onclick="zerarTudo()">
      <span class="warning-icon">🗑️</span>
      <span>Zerar TUDO (Vendas + Sessões)</span>
    </button>

    <button class="btn btn-secondary" onclick="voltar()">
      ← Voltar
    </button>
  </div>

  <div class="mensagem" id="mensagem"></div>
</div>

<script>
  // Carregar status das sessões ao abrir
  carregarStatus();

  async function carregarStatus() {
    try {
      const resp = await fetch('api/zerar-sessoes.php?action=status');
      const data = await resp.json();
      document.getElementById('totalSessoes').textContent = data.total_sessoes || 0;
    } catch (err) {
      console.error('Erro ao carregar status:', err);
      document.getElementById('totalSessoes').textContent = '?';
    }
  }

  async function zerarAbertas() {
    if (!confirm('⚠️ Deseja realmente zerar apenas as SESSÕES ABERTAS?\n\nEsta ação é irreversível!')) {
      return;
    }

    if (!confirm('Confirme novamente: Deletar todas as sessões abertas?')) {
      return;
    }

    executarZeramento('zerar_abertas', 'sessões abertas');
  }

  async function zerarTudo() {
    if (!confirm('🗑️ ATENÇÃO!\n\nDeseja realmente zerar TUDO (vendas + sessões)?\n\nEsta ação NÃO pode ser desfeita!')) {
      return;
    }

    if (!confirm('Confirme novamente: Deletar TODAS as vendas e sessões?')) {
      return;
    }

    executarZeramento('zerar_tudo', 'todos os dados');
  }

  async function executarZeramento(action, descricao) {
    const btn = event.target.closest('.btn');
    const msgDiv = document.getElementById('mensagem');

    btn.disabled = true;
    btn.innerHTML = '<span class="carregando"></span> Processando...';

    try {
      const resp = await fetch(`api/zerar-sessoes.php?action=${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });

      const resultado = await resp.json();

      if (resultado.sucesso) {
        msgDiv.className = 'mensagem sucesso';
        msgDiv.textContent = '✓ ' + resultado.mensagem;
        carregarStatus();
        setTimeout(() => {
          msgDiv.style.display = 'none';
        }, 3000);
      } else {
        msgDiv.className = 'mensagem erro';
        msgDiv.textContent = '❌ Erro: ' + resultado.mensagem;
      }
    } catch (err) {
      msgDiv.className = 'mensagem erro';
      msgDiv.textContent = '❌ Erro: ' + err.message;
    }

    btn.disabled = false;
    btn.textContent = btn.textContent.replace('Processando...', 'Tentar novamente');
    location.reload();
  }

  function voltar() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'admin.html';
    }
  }
</script>

</body>
</html>
