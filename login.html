<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cantina IBFC - Login</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/login-backgrounds.css">
  <style>
    body { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      background: url('uploads/backgrounds/cantina-background.jpg') center/cover no-repeat fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* Overlay escuro para melhorar legibilidade */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: -1;
    }
    .login-card { 
      background: white; 
      border-radius: 16px; 
      padding: 40px; 
      width: 100%; 
      max-width: 400px; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
    }
    .login-card h1 { 
      text-align: center; 
      margin-bottom: 30px; 
      color: #333; 
      font-size: 28px;
    }
    .form-group { 
      margin-bottom: 20px; 
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }
    .form-group input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      font-size: 14px; 
    }
    .form-group input:focus {
      outline: none;
      border-color: #ff7a45;
      box-shadow: 0 0 0 3px rgba(255, 122, 69, 0.1);
    }
    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -6px 0 16px;
      color: #444;
      font-size: 13px;
    }
    .remember-wrap input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ff7a45;
      cursor: pointer;
    }
    .remember-wrap label {
      cursor: pointer;
      user-select: none;
    }
    .btn { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg, #ff7a45 0%, #ff6a3d 100%); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-weight: 700; 
      cursor: pointer; 
      font-size: 16px;
    }
    .btn:hover { 
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 122, 69, 0.3);
    }
    .error { 
      color: #dc3545; 
      font-size: 14px; 
      margin-top: 10px; 
      display: none; 
      padding: 12px;
      background: #f8d7da;
      border-radius: 6px;
    }
    .success-screen {
      display: none;
      text-align: center;
    }
    .success-screen.show {
      display: block;
    }
    .role-badge {
      display: inline-block;
      margin: 20px 0;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      color: white;
    }
    .role-badge.admin {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .role-badge.vendedor {
      background: linear-gradient(135deg, #ff7a45 0%, #ff6a3d 100%);
    }
    .role-badge.usuario {
      background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
    }
    .welcome-msg {
      color: #333;
      margin: 20px 0;
      font-size: 16px;
    }
    .loading-spinner {
      display: none;
      margin: 20px 0;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #ff7a45;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .login-form {
      display: block;
    }
    .login-form.hide {
      display: none;
    }
    
    /* CSS para o modal de abertura de caixa */
    #modalAberturaCaixa {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: rgba(0,0,0,0.7) !important;
      z-index: 10000 !important;
      display: none;
      align-items: center !important;
      justify-content: center !important;
    }
    
    #modalAberturaCaixa > div {
      background: white !important;
      border-radius: 16px !important;
      padding: 32px !important;
      max-width: 450px !important;
      width: 90% !important;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4) !important;
      max-height: 90vh;
      overflow-y: auto;
    }

    @media (max-width: 768px) {
      body {
        padding: 14px;
      }

      .login-card {
        padding: 24px 16px;
        max-width: 100%;
      }

      .login-card h1 {
        font-size: 22px;
        flex-direction: column;
        gap: 8px;
      }

      .role-badge {
        width: 100%;
        padding: 12px 14px;
        font-size: 16px;
      }
    }

    @media (max-width: 420px) {
      .btn {
        padding: 12px;
        font-size: 15px;
      }

      .form-group input {
        padding: 10px;
      }
    }
  </style>
  <link rel="stylesheet" href="css/responsivo-mobile.css">
</head>
<body>
  <div class="login-card">
    <h1 style="display: flex; align-items: center; justify-content: center; gap: 12px;">
      <img src="LOGO_F.png" alt="Logo Cantina" style="height: 50px; width: auto; object-fit: contain;">
      <span id="nomeSistemaHeader">Cantina IBFC</span>
    </h1>
    
    <!-- FORMULÁRIO DE LOGIN -->
    <div class="login-form" id="loginForm">
      <form id="formLogin">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>
        </div>
        <div class="remember-wrap">
          <input type="checkbox" id="rememberPassword">
          <label for="rememberPassword">Lembrar senha neste computador</label>
        </div>
        <button type="submit" class="btn">Entrar</button>
        <div class="error" id="errorMsg"></div>
      </form>
    </div>

    <!-- TELA DE SUCESSO - EXIBE ATRIBUIÇÃO -->
    <div class="success-screen" id="successScreen">
      <div class="welcome-msg" id="welcomeMsg">Bem-vindo!</div>
      <div class="role-badge" id="roleBadge">Carregando...</div>
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p style="color: #999; font-size: 12px; margin-top: 10px;">Redirecionando...</p>
      </div>
    </div>
  </div>

  <!-- MODAL DE ABERTURA DE CAIXA -->
  <div id="modalAberturaCaixa" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; padding: 32px; max-width: 450px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.4);">
      <h2 style="margin: 0 0 8px; color: #333; font-size: 24px;">💰 Abertura de Caixa</h2>
      <p style="margin: 0 0 24px; color: #666; font-size: 14px;">Informe o valor inicial para começar o dia</p>
      
      <form id="formAberturaCaixaLogin" onsubmit="processarAberturaCaixa(event); return false;">
        <div style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; color: #333; font-weight: 600; font-size: 14px;">📅 Evento Conectado</label>
          <select id="eventoAberturaLogin" onchange="toggleNovoEventoLogin(this)" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: white; color: #333;">
            <option value="">-- Sem evento (Venda Geral) --</option>
            <option value="__novo__">➕ Criar Novo Evento...</option>
          </select>
          <div id="wrapNovoEventoLogin" style="display: none; margin-top: 8px;">
            <input type="text" id="novoEventoNomeLogin" placeholder="Nome do evento (ex: Culto Jovem, Retiro)" style="width: 100%; padding: 10px; border: 2px solid #27ae60; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
          </div>
        </div>

        <div style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; color: #333; font-weight: 600; font-size: 14px;">Valor de Abertura (R$)</label>
          <input type="text" id="valorAberturaLogin" placeholder="0,00" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box;" required>
        </div>
        
        <div style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 6px; color: #333; font-weight: 600; font-size: 14px;">Observações (opcional)</label>
          <input type="text" id="obsAberturaLogin" placeholder="Ex: Trocos iniciais..." style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
        </div>
        
        <div id="erroAbertura" style="display: none; background: #fadbd8; border-left: 4px solid #e74c3c; color: #c0392b; padding: 12px; margin-bottom: 16px; border-radius: 4px; font-size: 13px;"></div>
        
        <div style="display: flex; gap: 12px;">
          <button type="button" style="flex: 1; padding: 12px; background: #ecf0f1; color: #666; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;" onclick="cancelarAberturaCaixa()">Cancelar</button>
          <button type="submit" style="flex: 1; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s;" onmouseover="this.style.background='#229954'" onmouseout="this.style.background='#27ae60'">Confirmar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/sistema-core.js"></script>
  <script>
    const roleLabels = {
      admin: 'Administrador',
      vendedor: 'Ministério',
      administrador: 'Administrador',
      gestor: 'Administrador',
      atendente: 'Ministério',
      producao: 'Ministério',
      usuario: 'Ministério'
    };

    const nomeSistemaAtual = window.CantinaSistema ? window.CantinaSistema.nomeSistema : 'Cantina IBFC';
    const nomeSistemaHeader = document.getElementById('nomeSistemaHeader');
    if (nomeSistemaHeader) {
      nomeSistemaHeader.textContent = nomeSistemaAtual;
    }

    const roleClassMap = {
      admin: 'admin',
      vendedor: 'vendedor',
      administrador: 'admin',
      gestor: 'admin',
      atendente: 'vendedor',
      producao: 'vendedor',
      usuario: 'vendedor'
    };

    function normalizarTipoUsuario(tipo) {
      return window.CantinaSistema ? window.CantinaSistema.normalizarTipoUsuario(tipo) : 'vendedor';
    }

    function obterRoleLabel(tipo) {
      const valor = normalizarTipoUsuario(tipo);
      return window.CantinaSistema ? window.CantinaSistema.rotuloTipoUsuario(tipo) : (roleLabels[valor] || 'Ministério');
    }

    const LEMBRAR_LOGIN_KEY = 'cantinaLembrarLogin';
    const LEMBRAR_LOGIN_DIAS = 30;

    function carregarLembrarLogin() {
      try {
        const bruto = localStorage.getItem(LEMBRAR_LOGIN_KEY);
        if (!bruto) return null;
        const data = JSON.parse(bruto);
        if (!data || typeof data !== 'object') return null;
        if (data.remember === false) return null;
        if (!data.username) return null;
        if (data.salvoEm) {
          const salvoEm = new Date(data.salvoEm).getTime();
          const limite = Date.now() - (LEMBRAR_LOGIN_DIAS * 24 * 60 * 60 * 1000);
          if (!Number.isFinite(salvoEm) || salvoEm < limite) {
            return null;
          }
        }
        return data;
      } catch (err) {
        return null;
      }
    }

    function salvarLembrarLogin(payload) {
      localStorage.setItem(LEMBRAR_LOGIN_KEY, JSON.stringify({
        username: payload.username,
        remember: true,
        salvoEm: payload.salvoEm
      }));
    }

    function limparLembrarLogin() {
      localStorage.removeItem(LEMBRAR_LOGIN_KEY);
    }

    document.getElementById('rememberPassword').addEventListener('change', (e) => {
      if (!e.target.checked) {
        limparLembrarLogin();
      }
    });

    (function preencherLoginSalvo() {
      const data = carregarLembrarLogin();
      const chk = document.getElementById('rememberPassword');
      if (!chk) return;
      if (!data) {
        chk.checked = false;
        return;
      }
      chk.checked = true;
      document.getElementById('username').value = data.username || '';
    })();

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const rememberPassword = document.getElementById('rememberPassword');
      
      try {
        const res = await fetch('api/auth.php?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (data.sucesso) {
          const userType = normalizarTipoUsuario(data.usuario?.tipo || 'vendedor');
          const userName = data.usuario?.nome || username;
          const roleLabel = obterRoleLabel(userType);
          const badgeClass = roleClassMap[userType.toLowerCase()] || 'usuario';

          if (rememberPassword && rememberPassword.checked) {
            salvarLembrarLogin({
              username,
              remember: true,
              salvoEm: new Date().toISOString()
            });
          } else {
            limparLembrarLogin();
          }
          
          // Salvar dados
          localStorage.setItem('usuario', JSON.stringify(data.usuario));
          localStorage.setItem('token', data.token || 'temp-token');
          localStorage.setItem('username', username);
          localStorage.setItem('userType', userType);
          localStorage.setItem('userId', data.usuario?.id || '');
          localStorage.setItem('userName', userName);
          
          // Zerar dados residuais do login anterior para evitar erro na contagem
          localStorage.removeItem('valorAberturaAtual');
          localStorage.removeItem('eventoIdAtual');
          localStorage.removeItem('eventoNomeAtual');
          localStorage.removeItem('aberturaCaixaEm');

          // Salvar nova sessão de caixa zerada
          if (data.sessao_caixa_id) {
            localStorage.setItem('sessaoCaixaId', String(data.sessao_caixa_id));
          } else {
            localStorage.removeItem('sessaoCaixaId');
          }
          
          // Mostrar tela de sucesso
          document.getElementById('loginForm').classList.add('hide');
          document.getElementById('successScreen').classList.add('show');
          document.getElementById('welcomeMsg').textContent = `Bem-vindo, ${userName}!`;
          document.getElementById('roleBadge').textContent = `👤 ${roleLabel}`;
          document.getElementById('roleBadge').className = `role-badge ${badgeClass}`;
          
          // Para vendedores, mostrar modal de abertura de caixa
          // Para admins, ir direto para admin.html
          setTimeout(() => {
            console.log('setTimeout chamado, userType:', userType);
            if (userType === 'admin') {
              window.location.href = 'admin.html';
            } else {
              // Mostrar modal de abertura de caixa
              console.log('Tentando mostrar modal...');
              mostrarModalAberturaCaixa();
            }
          }, 2000);
        } else {
          errorMsg.textContent = data.mensagem || 'Erro ao fazer login';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Erro de conexão: ' + (err && err.message ? err.message : 'falha desconhecida');
        errorMsg.style.display = 'block';
      }
    });

    // ===== FUNÇÕES DO MODAL DE ABERTURA DE CAIXA =====
    function toggleNovoEventoLogin(sel) {
      const wrap = document.getElementById('wrapNovoEventoLogin');
      const input = document.getElementById('novoEventoNomeLogin');
      if (!wrap) return;
      if (sel.value === '__novo__') {
        wrap.style.display = 'block';
        if (input) input.focus();
      } else {
        wrap.style.display = 'none';
      }
    }

    async function carregarEventosLogin() {
      const sel = document.getElementById('eventoAberturaLogin');
      if (!sel) return;
      try {
        const res = await fetch('api/abertura-caixa.php?action=listar_eventos');
        const d = await res.json();
        if (d.sucesso && Array.isArray(d.dados)) {
          sel.innerHTML = '<option value="">-- Sem evento (Venda Geral) --</option>';
          d.dados.forEach(ev => {
            const opt = document.createElement('option');
            opt.value = ev.id;
            opt.textContent = `${ev.nome} (${ev.status || 'planejado'})`;
            sel.appendChild(opt);
          });
          const optNovo = document.createElement('option');
          optNovo.value = '__novo__';
          optNovo.textContent = '➕ Criar Novo Evento...';
          sel.appendChild(optNovo);
        }
      } catch (err) {
        console.error('Erro ao listar eventos:', err);
      }
    }
    
    function mostrarModalAberturaCaixa() {
      console.log('=== Abrindo modal de abertura de caixa ===');
      
      // Carregar lista de eventos
      carregarEventosLogin();
      const wrapNovo = document.getElementById('wrapNovoEventoLogin');
      if (wrapNovo) wrapNovo.style.display = 'none';
      
      // Verificar se elemento existe
      const modal = document.getElementById('modalAberturaCaixa');
      console.log('Modal encontrado:', !!modal);
      
      if (!modal) {
        console.error('❌ Modal não encontrado no DOM!');
        alert('Erro: Modal de abertura de caixa não foi encontrado. Verifique o código HTML.');
        return;
      }
      
      // Esconder tela de sucesso
      const successScreen = document.getElementById('successScreen');
      if (successScreen) {
        successScreen.style.display = 'none';
        console.log('Tela de sucesso escondida');
      }
      
      // Mostrar modal (com display flex)
      modal.style.display = 'flex';
      modal.style.visibility = 'visible';
      modal.style.opacity = '1';
      console.log('✅ Modal exibido:', modal.style.display);
      
      // Adicionar formatação ao input (apenas uma vez)
      const inputValor = document.getElementById('valorAberturaLogin');
      if (inputValor && !inputValor.hasAttribute('data-listener-added')) {
        inputValor.setAttribute('data-listener-added', 'true');
        inputValor.addEventListener('input', function(e) {
          let valor = e.target.value.replace(/\D/g, '');
          if (valor) {
            valor = (parseInt(valor) / 100).toLocaleString('pt-BR', {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            });
          }
          e.target.value = valor;
        });
        console.log('Formatação de moeda adicionada ao input');
      }
      
      // Verificar se já tem caixa aberto (opcional, não bloqueia)
      const userId = localStorage.getItem('userId');
      console.log('userId:', userId);
      
      if (userId) {
        fetch(`api/abertura-caixa.php?action=verificar_hoje&usuario_id=${userId}`)
          .then(r => r.json())
          .then(d => {
            console.log('Resposta verificar_hoje:', d);
            if (d.sucesso && d.dados) {
              const sessao = d.dados;
              console.log('Sessão encontrada:', sessao);
              
              // Se valor_abertura já foi preenchido, vai direto para vendas
              if (sessao.valor_abertura && parseFloat(sessao.valor_abertura) > 0) {
                console.log('Caixa já foi aberto com valor, redirecionando para vendas');
                localStorage.setItem('sessaoCaixaId', sessao.id_sessao);
                localStorage.setItem('aberturaCaixaEm', new Date().toISOString());
                localStorage.setItem('valorAberturaAtual', sessao.valor_abertura || '0');
                if (sessao.evento_id) {
                  localStorage.setItem('eventoIdAtual', sessao.evento_id);
                }
                if (sessao.evento_nome) {
                  localStorage.setItem('eventoNomeAtual', sessao.evento_nome);
                }
                setTimeout(() => window.location.href = 'vendas.html', 500);
              } else {
                // Se existe mas valor_abertura é vazio/zero, mostra o modal para preencher
                console.log('Sessão existe mas precisa preencher valor_abertura');
                localStorage.setItem('sessaoCaixaId', sessao.id_sessao);
              }
            } else {
              console.log('Nenhuma sessão encontrada para hoje');
            }
          })
          .catch(e => console.error('Erro ao verificar caixa:', e));
      }
    }

    async function processarAberturaCaixa(e) {
      e.preventDefault();
      
      const valorInput = document.getElementById('valorAberturaLogin').value;
      const obsInput = document.getElementById('obsAberturaLogin').value;
      const erroDiv = document.getElementById('erroAbertura');
      const sessaoCaixaId = localStorage.getItem('sessaoCaixaId');
      const userId = localStorage.getItem('userId');
      
      if (!valorInput || valorInput === '0,00') {
        erroDiv.textContent = 'Informe um valor de abertura válido';
        erroDiv.style.display = 'block';
        return;
      }
      
      if (!sessaoCaixaId || !userId) {
        erroDiv.textContent = 'Sessão inválida. Faça login novamente.';
        erroDiv.style.display = 'block';
        return;
      }
      
      const valor = parseFloat(valorInput.replace(/\./g, '').replace(',', '.'));
      
      if (isNaN(valor) || valor < 0) {
        erroDiv.textContent = 'Valor inválido';
        erroDiv.style.display = 'block';
        return;
      }

      const selectEvento = document.getElementById('eventoAberturaLogin');
      const inputNovoEvento = document.getElementById('novoEventoNomeLogin');
      let eventoId = selectEvento ? selectEvento.value : '';
      let eventoNome = '';

      if (eventoId === '__novo__') {
        eventoNome = inputNovoEvento ? inputNovoEvento.value.trim() : '';
        eventoId = '';
        if (!eventoNome) {
          erroDiv.textContent = 'Informe o nome do novo evento ou selecione um existente.';
          erroDiv.style.display = 'block';
          if (inputNovoEvento) inputNovoEvento.focus();
          return;
        }
      }
      
      try {
        const res = await fetch('api/abertura-caixa.php?action=registrar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessao_id: parseInt(sessaoCaixaId, 10),
            usuario_id: parseInt(userId, 10),
            valor_abertura: valor,
            observacoes: obsInput,
            evento_id: eventoId ? parseInt(eventoId, 10) : null,
            evento_nome: eventoNome || null
          })
        });
        
        const resultado = await res.json();
        
        if (resultado.sucesso) {
          localStorage.setItem('aberturaCaixaEm', new Date().toISOString());
          localStorage.setItem('valorAberturaAtual', valor.toString());
          if (resultado.evento_id) {
            localStorage.setItem('eventoIdAtual', resultado.evento_id);
          } else {
            localStorage.removeItem('eventoIdAtual');
          }
          if (resultado.evento_nome) {
            localStorage.setItem('eventoNomeAtual', resultado.evento_nome);
          } else {
            localStorage.removeItem('eventoNomeAtual');
          }
          window.location.href = 'vendas.html';
        } else {
          erroDiv.textContent = resultado.mensagem || 'Erro ao abrir caixa';
          erroDiv.style.display = 'block';
        }
      } catch (err) {
        erroDiv.textContent = 'Erro ao conectar: ' + err.message;
        erroDiv.style.display = 'block';
      }
    }
    }

    function cancelarAberturaCaixa() {
      if (confirm('Deseja voltar para login?')) {
        localStorage.removeItem('usuario');
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        localStorage.removeItem('userType');
        localStorage.removeItem('userId');
        localStorage.removeItem('userName');
        localStorage.removeItem('sessaoCaixaId');
        window.location.href = 'login-menu.html';
      }
    }
  </script>
</body>
