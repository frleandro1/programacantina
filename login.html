<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lefro Cantina - Login</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/login-backgrounds.css">
  <style>
    body { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      background: url('uploads/backgrounds/cantina-background.jpg') center/cover no-repeat fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* Overlay escuro para melhorar legibilidade */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: -1;
    }
    .login-card { 
      background: white; 
      border-radius: 16px; 
      padding: 40px; 
      width: 100%; 
      max-width: 400px; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
    }
    .login-card h1 { 
      text-align: center; 
      margin-bottom: 30px; 
      color: #333; 
      font-size: 28px;
    }
    .form-group { 
      margin-bottom: 20px; 
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }
    .form-group input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      font-size: 14px; 
    }
    .form-group input:focus {
      outline: none;
      border-color: #ff7a45;
      box-shadow: 0 0 0 3px rgba(255, 122, 69, 0.1);
    }
    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -6px 0 16px;
      color: #444;
      font-size: 13px;
    }
    .remember-wrap input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ff7a45;
      cursor: pointer;
    }
    .remember-wrap label {
      cursor: pointer;
      user-select: none;
    }
    .btn { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg, #ff7a45 0%, #ff6a3d 100%); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-weight: 700; 
      cursor: pointer; 
      font-size: 16px;
    }
    .btn:hover { 
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 122, 69, 0.3);
    }
    .error { 
      color: #dc3545; 
      font-size: 14px; 
      margin-top: 10px; 
      display: none; 
      padding: 12px;
      background: #f8d7da;
      border-radius: 6px;
    }
    .success-screen {
      display: none;
      text-align: center;
    }
    .success-screen.show {
      display: block;
    }
    .role-badge {
      display: inline-block;
      margin: 20px 0;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      color: white;
    }
    .role-badge.admin {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .role-badge.vendedor {
      background: linear-gradient(135deg, #ff7a45 0%, #ff6a3d 100%);
    }
    .role-badge.usuario {
      background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
    }
    .welcome-msg {
      color: #333;
      margin: 20px 0;
      font-size: 16px;
    }
    .loading-spinner {
      display: none;
      margin: 20px 0;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #ff7a45;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .login-form {
      display: block;
    }
    .login-form.hide {
      display: none;
    }

    @media (max-width: 768px) {
      body {
        padding: 14px;
      }

      .login-card {
        padding: 24px 16px;
        max-width: 100%;
      }

      .login-card h1 {
        font-size: 22px;
        flex-direction: column;
        gap: 8px;
      }

      .role-badge {
        width: 100%;
        padding: 12px 14px;
        font-size: 16px;
      }
    }

    @media (max-width: 420px) {
      .btn {
        padding: 12px;
        font-size: 15px;
      }

      .form-group input {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1 style="display: flex; align-items: center; justify-content: center; gap: 12px;">
      <img src="LOGO_F.png" alt="Logo Cantina" style="height: 50px; width: auto; object-fit: contain;">
      <span>Lefro Cantina</span>
    </h1>
    
    <!-- FORMULÁRIO DE LOGIN -->
    <div class="login-form" id="loginForm">
      <form id="formLogin">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>
        </div>
        <div class="remember-wrap">
          <input type="checkbox" id="rememberPassword">
          <label for="rememberPassword">Lembrar senha neste computador</label>
        </div>
        <button type="submit" class="btn">Entrar</button>
        <div class="error" id="errorMsg"></div>
      </form>
    </div>

    <!-- TELA DE SUCESSO - EXIBE ATRIBUIÇÃO -->
    <div class="success-screen" id="successScreen">
      <div class="welcome-msg" id="welcomeMsg">Bem-vindo!</div>
      <div class="role-badge" id="roleBadge">Carregando...</div>
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p style="color: #999; font-size: 12px; margin-top: 10px;">Redirecionando...</p>
      </div>
    </div>
  </div>

  <script>
    const roleLabels = {
      'admin': 'Administrador',
      'vendedor': 'Vendedor',
      'administrador': 'Administrador',
      'gestor': 'Administrador',
      'atendente': 'Vendedor',
      'producao': 'Vendedor',
      'usuario': 'Vendedor'
    };

    const roleClassMap = {
      'admin': 'admin',
      'vendedor': 'vendedor',
      'administrador': 'admin',
      'gestor': 'admin',
      'atendente': 'vendedor',
      'producao': 'vendedor',
      'usuario': 'vendedor'
    };

    function normalizarTipoUsuario(tipo) {
      const t = String(tipo || '').toLowerCase();
      if (t === 'admin' || t === 'administrador' || t === 'gestor') return 'admin';
      return 'vendedor';
    }

    const LEMBRAR_LOGIN_KEY = 'cantinaLembrarLogin';
    const LEMBRAR_LOGIN_DIAS = 30;

    function carregarLembrarLogin() {
      try {
        const bruto = localStorage.getItem(LEMBRAR_LOGIN_KEY);
        if (!bruto) return null;
        const data = JSON.parse(bruto);
        if (!data || typeof data !== 'object') return null;
        if (data.remember === false) return null;
        if (!data.username || !data.password) return null;
        if (data.salvoEm) {
          const salvoEm = new Date(data.salvoEm).getTime();
          const limite = Date.now() - (LEMBRAR_LOGIN_DIAS * 24 * 60 * 60 * 1000);
          if (!Number.isFinite(salvoEm) || salvoEm < limite) {
            return null;
          }
        }
        return data;
      } catch (err) {
        return null;
      }
    }

    function salvarLembrarLogin(payload) {
      localStorage.setItem(LEMBRAR_LOGIN_KEY, JSON.stringify(payload));
    }

    function limparLembrarLogin() {
      localStorage.removeItem(LEMBRAR_LOGIN_KEY);
    }

    document.getElementById('rememberPassword').addEventListener('change', (e) => {
      if (!e.target.checked) {
        limparLembrarLogin();
      }
    });

    (function preencherLoginSalvo() {
      const data = carregarLembrarLogin();
      const chk = document.getElementById('rememberPassword');
      if (!chk) return;
      if (!data) {
        chk.checked = false;
        return;
      }
      chk.checked = true;
      document.getElementById('username').value = data.username || '';
      document.getElementById('password').value = data.password || '';
    })();

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const rememberPassword = document.getElementById('rememberPassword');
      
      try {
        const res = await fetch('api/auth.php?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (data.sucesso) {
          const userType = normalizarTipoUsuario(data.usuario?.tipo || 'vendedor');
          const userName = data.usuario?.nome || username;
          const roleLabel = roleLabels[userType.toLowerCase()] || 'Usuário';
          const badgeClass = roleClassMap[userType.toLowerCase()] || 'usuario';

          if (rememberPassword && rememberPassword.checked) {
            salvarLembrarLogin({
              username,
              password,
              remember: true,
              salvoEm: new Date().toISOString()
            });
          } else {
            limparLembrarLogin();
          }
          
          // Salvar dados
          localStorage.setItem('usuario', JSON.stringify(data.usuario));
          localStorage.setItem('token', data.token || 'temp-token');
          localStorage.setItem('username', username);
          localStorage.setItem('userType', userType);
          
          // Mostrar tela de sucesso
          document.getElementById('loginForm').classList.add('hide');
          document.getElementById('successScreen').classList.add('show');
          document.getElementById('welcomeMsg').textContent = `Bem-vindo, ${userName}!`;
          document.getElementById('roleBadge').textContent = `👤 ${roleLabel}`;
          document.getElementById('roleBadge').className = `role-badge ${badgeClass}`;
          
          // Redirecionar após 2 segundos
          setTimeout(() => {
            if (userType === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'vendas.html';
            }
          }, 2000);
        } else {
          errorMsg.textContent = data.mensagem || 'Erro ao fazer login';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Erro de conexão: ' + (err && err.message ? err.message : 'falha desconhecida');
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
