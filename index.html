<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=login-menu.html">
  <title>Redirecionando...</title>
</head>
<body>
<button id="btnVoltarGlobal" type="button" style="position:fixed;top:14px;right:14px;z-index:9999;padding:10px 16px;border:none;border-radius:10px;background:#111;color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);">Voltar</button>
<script>
(function(){
  var btn = document.getElementById('btnVoltarGlobal');
  if (!btn) return;
  btn.addEventListener('click', function(){
    if (window.history.length > 1) {
      window.history.back();
      return;
    }
    window.location.href = 'login-menu.html';
  });
})();
</script>

  <script>
    function normalizarTipoUsuario(tipo) {
      const t = String(tipo || '').toLowerCase();
      if (t === 'admin' || t === 'administrador' || t === 'gestor') return 'admin';
      return 'vendedor';
    }

    // Verificar se o usuário já está logado
    const token = localStorage.getItem('token');
    const userTypeRaw = localStorage.getItem('userType');
    const userType = normalizarTipoUsuario(userTypeRaw);

    if (token && userType) {
      localStorage.setItem('userType', userType);
      // Usuário já está logado, redirecionar para dashboard apropriado
      if (userType === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'vendas.html';
      }
    } else {
      // Ir para login
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
