<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Administração - Cantina IBFC</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/relatorios-a4.css">
<script src="js/relatorios-a4.js" defer></script>
<style>
body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  margin: 0;
  background: #f5f5f5;
}

.content-wrapper {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.main-content {
  flex: 1;
  padding: 30px;
  overflow-y: auto;
}

.section {
  background: white;
  padding: 25px;
  border-radius: 14px;
  margin-bottom: 25px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.section-header h2 {
  color: #333;
  font-size: 22px;
}

.btn-group {
  display: flex;
  gap: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #f8f9fa;
}

thead th {
  padding: 14px;
  text-align: left;
  font-weight: 600;
  color: #495057;
  border-bottom: 2px solid #dee2e6;
}

tbody td {
  padding: 14px;
  border-bottom: 1px solid #e9ecef;
  color: #333;
}

tbody tr:hover {
  background: #f8f9fa;
}

.venda-acoes-cell {
  vertical-align: bottom;
}

.venda-acoes-wrap {
  display: flex;
  justify-content: flex-start;
  align-items: flex-end;
  min-height: 32px;
}

.btn-detalhes-venda {
  padding: 6px 10px;
  font-size: 12px;
  line-height: 1;
}

.venda-valor-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.btn-lupa-detalhes {
  padding: 4px 8px;
  font-size: 14px;
  line-height: 1;
}

.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.badge-success {
  background: #d4edda;
  color: #155724;
}

.badge-danger {
  background: #f8d7da;
  color: #721c24;
}

.btn-sm {
  padding: 6px 14px;
  font-size: 13px;
  border-radius: 6px;
}

.btn-icon {
  padding: 8px 12px;
  background: white;
  border: 2px solid #dee2e6;
  border-radius: 6px;
  cursor: pointer;
  color: #495057;
  font-size: 14px;
  transition: all 0.2s;
}

.btn-icon:hover {
  border-color: var(--brand);
  color: var(--brand);
}

.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  color: #495057;
  font-weight: 500;
  font-size: 14px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid #dee2e6;
  border-radius: 8px;
  font-size: 14px;
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--brand);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}

.empty-state-icon {
  font-size: 64px;
  margin-bottom: 15px;
  opacity: 0.3;
}

.filters {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: end;
}

.filters > * {
  flex: 1;
  min-width: 180px;
}

@media (max-width: 1024px) {
  .main-content {
    padding: 16px;
  }

  .section {
    padding: 16px;
  }
}

@media (max-width: 768px) {
  .section-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .btn-group {
    width: 100%;
    flex-direction: column;
  }

  .btn-group .btn {
    width: 100%;
  }

  table {
    display: block;
    width: 100%;
    overflow-x: auto;
    white-space: nowrap;
  }
}

@media print {
  .topbar, .btn, .filters {
    display: none !important;
  }
}
</style>
<link rel="stylesheet" href="css/responsivo-mobile.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <img src="LOGO_F.png" alt="Logo Cantina" class="brand-logo">
    <span>Cantina IBFC</span>
  </div>
  <nav class="nav">
   <!--<a href="vendas.html">Vendas</a>-->
    <a href="dashboard.html">Produção</a>
    <a href="login.html" class="active">Administração</a>
    <a href="relatorios.html">Relatórios</a>
    <a href="financeiro.html">Financeiro</a>
    <a href="login-menu.html" onclick="if (window.history.length > 1) { window.history.back(); return false; }">Voltar</a>
    <a href="#" onclick="logout()">Sair</a>
  </nav>
</div>
<div class="content-wrapper">
  <div class="main-content">
    <div class="section">
      <div class="section-header">
        <h2>Produtos</h2>
        <button class="btn btn-primary" onclick="abrirModalProduto()">+ Novo Produto</button>
      </div>
      <div class="filters">
        <div class="form-group">
          <label>Buscar</label>
          <input type="text" id="searchProduto" placeholder="Nome do produto..." onkeyup="filtrarProdutos()">
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <select id="filterCategoria" onchange="filtrarProdutos()">
            <option value="Todos" selected>Todos</option>
            <option value="Salgado">Salgado</option>
            <option value="Bebida">Bebida</option>
            <option value="Doce">Doce</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
      </div>
      <table id="tableProdutos">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div id="modalProduto" class="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Novo Produto</h2>
    <form id="formProduto" onsubmit="salvarProduto(event)">
      <input type="hidden" id="produtoId">
      <div class="form-row">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" id="produtoNome" required>
        </div>
        <div class="form-group">
          <label>Categoria *</label>
          <select id="produtoCategoria" required>
            <option value="">Selecione...</option>
            <option value="Todos">Todos</option>
            <option value="Salgado">Salgado</option>
            <option value="Bebida">Bebida</option>
            <option value="Doce">Doce</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Preço de Venda *</label>
          <input type="number" id="produtoPreco" step="0.01" required>
        </div>
        <div class="form-group">
          <label>Estoque Atual *</label>
          <input type="number" id="produtoEstoque" required>
        </div>
      </div>
      <div class="btn-group" style="margin-top: 20px;">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="button" class="btn" onclick="fecharModalProduto()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/dashboard.js?v=20261020_producao_produtos"></script>
</body>
</html>
