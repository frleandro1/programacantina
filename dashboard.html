<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração - Programa Cantina</title>
<link rel="stylesheet" href="css/theme.css">
<style>
body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  margin: 0;
  background: #f5f5f5;
}

.content-wrapper {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.main-content {
  flex: 1;
  padding: 30px;
  overflow-y: auto;
}

.section {
  background: white;
  padding: 25px;
  border-radius: 14px;
  margin-bottom: 25px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.section-header h2 {
  color: #333;
  font-size: 22px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.stat-card {
  background: white;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  border-left: 4px solid var(--brand);
  transition: all 0.3s;
}

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}

.stat-card h3 {
  color: #666;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.stat-card .value {
  color: var(--brand);
  font-size: 32px;
  font-weight: bold;
}

.btn-group {
  display: flex;
  gap: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #f8f9fa;
}

thead th {
  padding: 14px;
  text-align: left;
  font-weight: 600;
  color: #495057;
  border-bottom: 2px solid #dee2e6;
}

tbody td {
  padding: 14px;
  border-bottom: 1px solid #e9ecef;
  color: #333;
}

tbody tr:hover {
  background: #f8f9fa;
}

.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.badge-success {
  background: #d4edda;
  color: #155724;
}

.badge-danger {
  background: #f8d7da;
  color: #721c24;
}

.btn-sm {
  padding: 6px 14px;
  font-size: 13px;
  border-radius: 6px;
}

.btn-icon {
  padding: 8px 12px;
  background: white;
  border: 2px solid #dee2e6;
  border-radius: 6px;
  cursor: pointer;
  color: #495057;
  font-size: 14px;
  transition: all 0.2s;
}

.btn-icon:hover {
  border-color: var(--brand);
  color: var(--brand);
}

.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  color: #495057;
  font-weight: 500;
  font-size: 14px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid #dee2e6;
  border-radius: 8px;
  font-size: 14px;
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--brand);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}

.empty-state-icon {
  font-size: 64px;
  margin-bottom: 15px;
  opacity: 0.3;
}

.filters {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: end;
}

.filters > * {
  flex: 1;
  min-width: 180px;
}

@media print {
  .topbar, .btn, .filters {
    display: none !important;
  }
}
</style>
</head>
<body>
<button id="btnVoltarGlobal" type="button" style="position:fixed;top:14px;right:14px;z-index:9999;padding:10px 16px;border:none;border-radius:10px;background:#111;color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);">Voltar</button>
<script>
(function(){
  var btn = document.getElementById('btnVoltarGlobal');
  if (!btn) return;
  btn.addEventListener('click', function(){
    if (window.history.length > 1) {
      window.history.back();
      return;
    }
    window.location.href = 'login-menu.html';
  });
})();
</script>
<div class="topbar">
  <div class="brand">
    <img src="LOGO_F.png" alt="Logo Cantina" class="brand-logo">
    <span>Programa Cantina</span>
  </div>
  <nav class="nav">
    <a href="vendas.html">Vendas</a>
    <a href="dashboard.html">Produção</a>
    <a href="relatorios.html">Relatórios</a>
    <a href="login-menu.html" class="active">Administração</a>
    <a href="#" onclick="logout()">Sair</a>
  </nav>
</div>
<div class="content-wrapper">
  <div class="main-content">
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Produtos Cadastrados</h3>
        <div class="value" id="totalProdutos">0</div>
      </div>
      <div class="stat-card">
        <h3>Vendas Hoje</h3>
        <div class="value" id="vendasHoje">0</div>
      </div>
      <div class="stat-card">
        <h3>Total Hoje</h3>
        <div class="value" id="totalHoje">R$ 0,00</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Gestão de Produtos</h2>
        <button class="btn btn-primary" onclick="abrirModalProduto()">+ Novo Produto</button>
      </div>
      <div class="filters">
        <div class="form-group">
          <label>Buscar</label>
          <input type="text" id="searchProduto" placeholder="Nome do produto..." onkeyup="filtrarProdutos()">
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <select id="filterCategoria" onchange="filtrarProdutos()">
            <option value="Todos" selected>Todos</option>
            <option value="Salgado">Salgado</option>
            <option value="Bebida">Bebida</option>
            <option value="Doce">Doce</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
      </div>
      <table id="tableProdutos">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Últimas Vendas</h2>
        <button class="btn" onclick="carregarVendas()"> Atualizar</button>
      </div>
      <table id="tableVendas">
        <thead>
          <tr>
            <th>Número</th>
            <th>Data/Hora</th>
            <th>Atendente</th>
            <th>Valor</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div id="modalProduto" class="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Novo Produto</h2>
    <form id="formProduto" onsubmit="salvarProduto(event)">
      <input type="hidden" id="produtoId">
      <div class="form-row">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" id="produtoNome" required>
        </div>
        <div class="form-group">
          <label>Categoria *</label>
          <select id="produtoCategoria" required>
            <option value="">Selecione...</option>
            <option value="Todos">Todos</option>
            <option value="Salgado">Salgado</option>
            <option value="Bebida">Bebida</option>
            <option value="Doce">Doce</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Preço de Venda *</label>
          <input type="number" id="produtoPreco" step="0.01" required>
        </div>
        <div class="form-group">
          <label>Estoque Atual *</label>
          <input type="number" id="produtoEstoque" required>
        </div>
      </div>
      <div class="btn-group" style="margin-top: 20px;">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="button" class="btn" onclick="fecharModalProduto()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/dashboard.js?v=20260413b"></script>
</body>
</html>
